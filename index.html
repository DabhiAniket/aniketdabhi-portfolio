<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!--seo:start--><!-- per-route title, meta, Open Graph, Twitter and JSON-LD are injected at build time (seo-plugin.js) --><!--seo:end-->
  <meta name="theme-color" content="#131424" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Sora is self-hosted (public/fonts, @font-face in src/index.css): no render-blocking third-party CSS -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/sora-latin-v17.woff2" crossorigin />
  <link rel="preload" as="image" href="/logo.webp" />
  <!-- Page-transition splash logo: the largest element on first paint of every page -->
  <link rel="preload" as="image" type="image/webp" href="/full-logo-450.webp" imagesrcset="/full-logo-450.webp 450w, /full-logo-640.webp 640w, /full-logo.webp 900w" imagesizes="min(450px, 80vw)" fetchpriority="high" />
  <!-- Without JavaScript the splash would never be removed, so hide it and show the noscript content. -->
  <noscript><style>#boot-splash{display:none}</style></noscript>
</head>

<body>
  <!-- Same look as the first frame of the page transition (src/components/Transition.jsx), but painted
       straight from the HTML so the logo shows before the JavaScript loads. React removes it once its own
       identical overlay is on screen. -->
  <div id="boot-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#05020a 0%,#11072b 75%,rgba(241,48,36,0.25) 100%)">
    <img src="/full-logo-450.webp" srcset="/full-logo-450.webp 450w, /full-logo-640.webp 640w, /full-logo.webp 900w" sizes="min(450px, 80vw)" alt="" width="450" height="450" fetchpriority="high" style="width:min(450px,80vw);height:auto" />
  </div>
